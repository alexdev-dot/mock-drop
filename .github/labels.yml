# GitHub Labels Configuration
# This file defines the labels used in the mock-drop repository
# To apply these labels, use a tool like github-label-sync or create them manually

labels:
  - name: bug
    color: d73a4a
    description: Something isn't working

  - name: enhancement
    color: a2eeef
    description: New feature or improvement

  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation

  - name: question
    color: d876e3
    description: Further information is requested

  - name: help wanted
    color: 008672
    description: Extra attention is needed

  - name: good first issue
    color: 7057ff
    description: Good for newcomers

  - name: dependencies
    color: 0366d6
    description: Pull requests that update a dependency file

  - name: dependabot
    color: 0258c7
    description: Dependabot automated PRs

  - name: github-actions
    color: 1d76db
    description: GitHub Actions related changes

  - name: security
    color: 02d1c5
    description: Security-related issues or PRs

  - name: priority: critical
    color: b60205
    description: Critical priority - needs immediate attention

  - name: priority: high
    color: d93f0b
    description: High priority

  - name: priority: medium
    color: fbca04
    description: Medium priority

  - name: priority: low
    color: 7057ff
    description: Low priority

  - name: feature
    color: 5319e7
    description: New feature

  - name: fix
    color: c2e0c6
    description: Bug fix

  - name: refactor
    color: f4d03f
    description: Code refactoring

  - name: test
    color: bfd4f2
    description: Adding or updating tests

  - name: performance
    color: 1d76db
    description: Performance improvements

  - name: breaking-change
    color: b60205
    description: Breaking changes

  - name: wontfix
    color: ffffff
    description: This will not be worked on

  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists

  - name: invalid
    color: e4e9ea
    description: This doesn't seem right

  - name: work in progress
    color: fef2c0
    description: Work is in progress

  - name: needs review
    color: fbca04
    description: Pull request needs review

  - name: approved
    color: 2ea44f
    description: Pull request approved

  - name: changes requested
    color: bf4b8a
    description: Changes requested on pull request
